<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>عهدة الكاشير — شاورما الأبراج</title>
<link rel="icon" href="assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css?v=20260825c" />
</head>
<body>
<div class="cashier-shell">

  <!-- شاشة القفل -->
  <div id="lock-screen" class="lock-screen">
    <div class="brand-mark"><img src="assets/img/logo.png" alt="شعار شاورما الأبراج" /></div>
    <div class="lock-title">أدخل الرقم السري</div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>
    <div class="pin-pad" id="pin-pad"></div>
    <div class="pin-error-msg" id="pin-error"></div>
  </div>

  <!-- الشاشة الرئيسية -->
  <div id="main-screen" style="display:none">
    <div class="cashier-header">
      <div class="brand-mark"><img src="assets/img/logo.png" alt="شعار شاورما الأبراج" /></div>
      <div style="flex:1">
        <h1>عهدة الكاشير</h1>
        <div class="sub">شاورما الأبراج</div>
      </div>
      <span class="sync-status" id="sync-status"></span>
      <button class="btn btn-sm" id="lock-btn">🔒 قفل</button>
    </div>

    <div id="cashier-content"></div>
  </div>

</div>

<script src="assets/js/data.js?v=20260825c"></script>
<script src="assets/js/cashier.js?v=20260825c"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>تسجيل التسويق — شاورما الأبراج</title>
<link rel="icon" href="assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css?v=20260810e" />
</head>
<body>
<div class="page-shell">

  <!-- شاشة القفل -->
  <div id="lock-screen" class="lock-screen">
    <div class="brand-mark"><img src="assets/img/logo.png" alt="شعار شاورما الأبراج" /></div>
    <div class="lock-title">أدخل الرقم السري</div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>
    <div class="pin-pad" id="pin-pad"></div>
    <div class="pin-error-msg" id="pin-error"></div>
  </div>

  <!-- الشاشة الرئيسية -->
  <div id="main-screen" style="display:none">
    <header class="topbar">
      <div class="topbar-brand">
        <div class="brand-mark"><img src="assets/img/logo.png" alt="شعار شاورما الأبراج" /></div>
        <div class="topbar-divider"></div>
        <div class="topbar-title">
          <h1>تسجيل التسويق</h1>
          <div class="sub">شاورما الأبراج — الفعلي الأسبوعي لكل نشاط</div>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="sync-status" id="sync-status"></span>
        <button class="btn" id="lock-btn">🔒 قفل</button>
      </div>
    </header>

    <p class="footnote" style="margin:0 4px 14px">المستهدفات نفسها تُدار من لوحة المالك — هنا تسجّلين بس كم سويتي فعلياً من كل نشاط هذا الأسبوع.</p>
    <div class="card" id="marketing-toolbar" style="margin-bottom:16px"></div>
    <div id="marketing-body"></div>
  </div>

</div>

<script src="assets/js/data.js?v=20260810e"></script>
<script src="assets/js/marketer.js?v=20260810e"></script>
</body>
</html>
